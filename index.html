function manageGroups(){
  const ov=showModal(`<div class="m-head"><h3>管理分组</h3><button data-close>✕</button></div>
    <div class="m-body" id="mgBody"></div>
    <div class="m-foot"><button class="btn primary" data-close>完成</button></div>`);
  const body=ov.querySelector('#mgBody');
  const render=()=>{
    body.innerHTML=S.cards.groups.map(g=>`
      <div class="list-item"><div class="li-main">${esc(g)}</div>
        <button class="btn sm" data-ren="${esc(g)}">重命名</button>
        <button class="btn sm danger" data-del="${esc(g)}">删除</button>
      </div>`).join('')+
      `<button class="btn primary block" id="mgNew">新建分组</button>`;
    body.querySelectorAll('[data-ren]').forEach(b=>{
      b.onclick=()=>{
        const g=b.dataset.ren;const nn=prompt('新的分组名',g);
        if(!nn||nn===g) return;
        S.cards.groups=S.cards.groups.map(x=>x===g?nn:x);
        S.cards.list.forEach(c=>{if(c.g===g)c.g=nn;});
        save('cards');render();renderCardPanel();
      };
    });
    body.querySelectorAll('[data-del]').forEach(b=>{
      b.onclick=()=>{
        const g=b.dataset.del;
        if(S.cards.groups.length<=1){toast('至少保留一个分组');return;}
        S.cards.groups=S.cards.groups.filter(x=>x!==g);
        S.cards.list=S.cards.list.filter(c=>c.g!==g);
        save('cards');render();renderCardPanel();
      };
    });
    body.querySelector('#mgNew').onclick=()=>{
      const nn=prompt('新分组名');
      if(!nn||S.cards.groups.includes(nn)) return;
      S.cards.groups.push(nn);save('cards');render();renderCardPanel();
    };
  };
  render();
}
function manageCards(){
  const ov=showModal(`<div class="m-head"><h3>字卡管理</h3><button data-close>✕</button></div>
    <div class="m-body" id="mcBody"></div>
    <div class="m-foot" style="flex-wrap:wrap;gap:8px">
      <span class="small" id="mcCount">已选 0 张</span>
      <button class="btn sm" id="mcAll">全选</button>
      <button class="btn sm" id="mcMove">移动</button>
      <button class="btn sm danger" id="mcDel">删除</button>
      <button class="btn sm" data-close>退出</button>
    </div>`);
  const body=ov.querySelector('#mcBody');
  const sel=new Set();
  const render=()=>{
    body.innerHTML=S.cards.list.length?S.cards.list.map(c=>`
      <div class="list-item">
        <input type="checkbox" data-sel="${c.id}" ${sel.has(c.id)?'checked':''} style="width:18px;height:18px">
        <div class="li-main">${esc(c.t)}<div class="li-sub">${esc(c.g)}</div></div>
      </div>`).join(''):'<div class="empty">暂无字卡</div>';
    body.querySelectorAll('[data-sel]').forEach(cb=>{
      cb.onchange=()=>{if(cb.checked) sel.add(cb.dataset.sel); else sel.delete(cb.dataset.sel);
        ov.querySelector('#mcCount').textContent=`已选 ${sel.size} 张`;};
    });
  };
  render();
  ov.querySelector('#mcAll').onclick=()=>{
    if(sel.size===S.cards.list.length) sel.clear();else S.cards.list.forEach(c=>sel.add(c.id));
    render();ov.querySelector('#mcCount').textContent=`已选 ${sel.size} 张`;
  };
  ov.querySelector('#mcDel').onclick=()=>{
    if(!sel.size){toast('请先选择');return;}
    S.cards.list=S.cards.list.filter(c=>!sel.has(c.id));
    sel.clear();save('cards');render();renderCardPanel();
    ov.querySelector('#mcCount').textContent='已选 0 张';
  };
  ov.querySelector('#mcMove').onclick=()=>{
    if(!sel.size){toast('请先选择');return;}
    const g=prompt(`移动到分组（可选：${S.cards.groups.join(' / ')}）`);
    if(!g) return;
    if(!S.cards.groups.includes(g)) S.cards.groups.push(g);
    S.cards.list.forEach(c=>{if(sel.has(c.id))c.g=g;});
    sel.clear();save('cards');render();renderCardPanel();
    ov.querySelector('#mcCount').textContent='已选 0 张';
  };
}
function importCards(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,.txt';
  inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;
    try{
      const txt=await readFile(f,'text');
      let data;try{data=JSON.parse(txt);}catch(e){data=null;}
      if(data&&data.type==='cards'){
        data.list.forEach(c=>{if(!S.cards.groups.includes(c.g)) S.cards.groups.push(c.g);
          S.cards.list.push({id:uid(),g:c.g,t:c.t});});
      }else if(data&&Array.isArray(data)){data.forEach(c=>S.cards.list.push({id:uid(),g:S.cards.groups[0],t:String(c)}));}
      else{txt.split('\n').map(s=>s.trim()).filter(Boolean).forEach(t=>S.cards.list.push({id:uid(),g:S.cards.groups[0],t}));}
      save('cards');renderCardPanel();toast('导入完成');
    }catch(e){toast('导入失败');}
  };
  inp.click();
}

/* 通话 */
let callState=null;
function startCall(dir){
  if(callState) return;
  callState={dir, start:0, timer:null, active:false, waitTimer:null, hangTimer:null, countdownTimer:null};
  const ui=S.chatCfg.ui;
  $('#callOverlay').classList.add('show');
  $('#callBg').style.backgroundImage = ui.callImg?`url("${ui.callImg}")`:'none';
  $('#callAv').src = ui.avatarTa || AV_PH;
  $('#callName').textContent = ui.nameTa || 'Ta';
  $('#callStatus').textContent = dir==='in'?'邀请你通话…':'正在呼叫…';
  $('#callActions').innerHTML = dir==='in' ? `
    <button class="call-btn reject" id="cReject">
      <svg viewBox="0 0 24 24"><path d="M5 19L19 5M9 5h10v10"/></svg>
    </button>
    <button class="call-btn accept" id="cAccept">
      <svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>
    </button>` : `
    <button class="call-btn reject" id="cReject">
      <svg viewBox="0 0 24 24"><path d="M5 19L19 5M9 5h10v10"/></svg>
    </button>`;
  startRingLoop();
  const name = ui.nameTa || 'Ta';
  if(dir==='in'){
  let remain = 30;
  $('#callStatus').textContent = '邀请你通话… ' + remain + 's';
  callState.countdownTimer = setInterval(()=>{
    remain--;
    if(remain <= 0){
      clearInterval(callState.countdownTimer);
      if(callState && !callState.active){
        pushMsg({side:'sys',type:'sys',text:'未接来电'});
        endCall();
      }
      return;
    }
    if(callState && !callState.active){
      $('#callStatus').textContent = '邀请你通话… ' + remain + 's';
    }
  }, 1000);
  $('#cAccept').onclick = ()=>answerCall();
  $('#cReject').onclick = ()=>{pushMsg({side:'sys',type:'sys',text:'你拒接了来电'});endCall();};
} else {
    $('#cReject').onclick = ()=>{pushMsg({side:'sys',type:'sys',text:'你取消了通话'});endCall();};
    callState.waitTimer = setTimeout(()=>{
      if(!callState) return;
      const c=S.chatCfg.call;const roll=Math.random()*100;
      if(roll < c.busyProb){pushMsg({side:'sys',type:'sys',text:`${name} 正在忙，暂时无法接听`});endCall();}
      else if(roll < c.busyProb + c.rejectProb){pushMsg({side:'sys',type:'sys',text:`${name} 拒绝了你的通话`});endCall();}
      else if(roll < c.busyProb + c.rejectProb + c.answerProb){answerCall();}
      else {pushMsg({side:'sys',type:'sys',text:`${name} 没有接听`});endCall();}
    }, randInt(8000, 15000));
  }
}
function incomingCall(){if(callState) return;startCall('in');}
function answerCall(){
  if(!callState || callState.active) return;
  clearTimeout(callState.waitTimer);
  clearInterval(callState.countdownTimer);
  stopRingLoop();
  callState.active = true;callState.start = now();
  $('#callOverlay').classList.remove('show');
  showCallMini();
  callState.timer = setInterval(()=>{
    if(!callState || !callState.active) return;
    const s=Math.floor((now()-callState.start)/1000);
    $('#miniTime').textContent = pad2(Math.floor(s/60))+':'+pad2(s%60);
  }, 1000);
  const name=S.chatCfg.ui.nameTa||'Ta';
  if(Math.random()*100 < S.chatCfg.call.hangProb){
    callState.hangTimer = setTimeout(()=>{
      if(callState && callState.active){
        pushMsg({side:'sys',type:'sys',text:`${name} 挂断了通话`});endCall();
      }
    }, randInt(15000, 60000));
  }
}
function showCallMini(){
  const ui = S.chatCfg.ui;
  $('#miniAv').src = ui.avatarTa || AV_PH;
  $('#miniName').textContent = ui.nameTa || 'Ta';
  $('#miniTime').textContent = '00:00';

  }else{el.style.left = ''; el.style.top = '';el.style.right = '14px';el.style.bottom = '110px';}
}
function bindMiniDrag(){
  const el = $('#callMini');
  let drag=false, sx=0, sy=0, ox=0, oy=0;
  el.addEventListener('touchstart', e=>{
    if(e.target.closest('.mini-hang')) return;
    const p=e.touches[0];drag=true;sx=p.clientX; sy=p.clientY;
    const r=el.getBoundingClientRect();ox=r.left; oy=r.top;
    el.style.left=ox+'px';el.style.top=oy+'px';el.style.right='auto';el.style.bottom='auto';
  }, {passive:true});
  el.addEventListener('touchmove', e=>{
    if(!drag) return;e.preventDefault();
    const p=e.touches[0];
    el.style.left = clamp(ox + p.clientX - sx, 4, innerWidth - el.offsetWidth - 4)+'px';
    el.style.top = clamp(oy + p.clientY - sy, 4, innerHeight - el.offsetHeight - 4)+'px';
  }, {passive:false});
  const onEnd = ()=>{if(!drag) return;drag=false;
    const r=el.getBoundingClientRect();S.chatCfg.ui.callMiniPos = {x:r.left, y:r.top};save('chatCfg');};
  el.addEventListener('touchend', onEnd);el.addEventListener('touchcancel', onEnd);
  el.addEventListener('mousedown', e=>{
    if(e.target.closest('.mini-hang')) return;
    drag=true;sx=e.clientX; sy=e.clientY;
    const r=el.getBoundingClientRect();ox=r.left; oy=r.top;
    el.style.left=ox+'px';el.style.top=oy+'px';el.style.right='auto';el.style.bottom='auto';
  });
  window.addEventListener('mousemove', e=>{
    if(!drag) return;
    el.style.left = clamp(ox + e.clientX - sx, 4, innerWidth - el.offsetWidth - 4)+'px';
    el.style.top = clamp(oy + e.clientY - sy, 4, innerHeight - el.offsetHeight - 4)+'px';
  });
  window.addEventListener('mouseup', onEnd);
  $('#miniHang').onclick = ()=>{pushMsg({side:'sys',type:'sys',text:'你挂断了通话'});endCall();};
}
function endCall(){
  const st = callState;callState = null;
  if(st){clearInterval(st.timer);clearTimeout(st.waitTimer);clearTimeout(st.hangTimer);clearInterval(st.countdownTimer);}
  stopRingLoop();
  $('#callOverlay').classList.remove('show');$('#callMini').classList.remove('show');
  if(st && st.active){
    const dur = Math.floor((now() - st.start)/1000);
    if(dur > 0){pushMsg({side:'sys',type:'sys',text:`通话结束 · 时长 ${pad2(Math.floor(dur/60))}:${pad2(dur%60)}`});}
  }
}

/* 时间引擎 */
function runTask(task){
  switch(task.kind){
    case 'reply': doReply(task.payload||{}); break;
    case 'proactive': doProactiveMsg(); break;
    case 'readNoReply': doReadNoReply(); break;
    case 'recall': doRecall(task.payload.mid); break;
    case 'letterIn': doLetterIn(); break;
    case 'letterReply': doLetterReply(); break;
  }
}
function doProactiveMsg(){
  const text=pickCardText();
  pushMsg({side:'ta',type:'text',text,proactive:true});
  if(Math.random()*100 < S.chatCfg.reply.recall){
    const last=S.chat.msgs[S.chat.msgs.length-1];
    S.timers.queue.push({t:now()+randInt(2500,6000),kind:'recall',payload:{mid:last.id}});save('timers');
  }
}
function doLetterIn(){
  const content=taLetterContent();
  S.letters.in.push({id:uid(),ts:now(),content,images:[],preview:content.slice(0,40)});save('letters');
  toast('收到了一封新的信');
  if($('#p-letter').classList.contains('active')) renderLetter();
  notify('你收到了一封信',content.slice(0,40));
  if(!$('#p-letter').classList.contains('active')){
    S.unread = S.unread || {chat:0,letter:0};
    S.unread.letter = (S.unread.letter||0)+1;
    save('unread');
    renderDesktop();
  }
}
function doLetterReply(){
  const content=taLetterContent();
  S.letters.in.push({id:uid(),ts:now(),content,images:[],preview:content.slice(0,40)});save('letters');
  const name=S.chatCfg.ui.nameTa||'Ta';
  toast(`${name} 回信了`);
  if($('#p-letter').classList.contains('active')) renderLetter();
  notify(`${name} 回信了`,content.slice(0,40));
  if(!$('#p-letter').classList.contains('active')){
    S.unread = S.unread || {chat:0,letter:0};
    S.unread.letter = (S.unread.letter||0)+1;
    save('unread');
    renderDesktop();
  }
}
function notify(title, body) {
  if (!S.sysCfg.alive) return;
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  
  // 优先使用 Service Worker 发送通知
  if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
    navigator.serviceWorker.ready.then(registration => {
      registration.showNotification(title, {
        body: body,
        tag: 'nijiyuzhou-msg',
        renotify: true,
        icon: 'icon-192.png' // 确保图标路径正确
      });
    }).catch(() => {
      // 降级方案：如果 SW 失败，再尝试 old 方式
      try { new Notification(title, { body }); } catch (e) {}
    });
  } else {
    // 降级方案
    try { new Notification(title, { body }); } catch (e) {}
  }
}
function tick(){
  updateClock();
  const t=now();
  const q=S.timers.queue||[];
  if(q.length){
    const due=[],rest=[];
    q.forEach(x=>{(x.t<=t?due:rest).push(x);});
    if(due.length){
      S.timers.queue=rest;due.sort((a,b)=>a.t-b.t);due.forEach(runTask);save('timers');
    }
  }
  const a=S.chatCfg.active;
  if(a.prob>0){
    if(!S.timers.nextProactive){scheduleProactive();}
    else if(S.timers.nextProactive<=t){doProactive();}
  }else if(S.timers.nextProactive){S.timers.nextProactive=0;save('timers');}
  const lc=S.chatCfg.letter;
  if(lc.prob>0){
    if(!S.timers.nextLetter){
      S.timers.nextLetter = t + randInt(Math.max(1,lc.minTime),Math.max(2,lc.maxTime))*60000;save('timers');
    }else if(S.timers.nextLetter<=t){
      if(Math.random()*100 < lc.prob) S.timers.queue.push({t:t,kind:'letterIn'});
      S.timers.nextLetter = t + randInt(Math.max(1,lc.minTime),Math.max(2,lc.maxTime))*60000;save('timers');
    }
  }else if(S.timers.nextLetter){S.timers.nextLetter=0;save('timers');}
  if(S.timers.nextLetterReply && S.timers.nextLetterReply<=t){
    S.timers.nextLetterReply=0;S.timers.queue.push({t:t,kind:'letterReply'});save('timers');
  }
  const c=S.chatCfg.call;
  if(c.incomingProb>0){
    if(!S.timers.nextCall){S.timers.nextCall = t + 120000;save('timers');}
    else if(S.timers.nextCall<=t){
      S.timers.nextCall = t + 120000;
      if(!callState && Math.random()*100 < c.incomingProb) incomingCall();
      save('timers');
    }
  }else if(S.timers.nextCall){S.timers.nextCall=0;save('timers');}
  updateReplyStatus();
}

/* 启动 */
async function boot(){
  await openDB();
  const keys=['chat','chatCfg','sysCfg','cards','emojis','seek','anniv','letters','timers','fortune','unread'];
  for(const k of keys){
    const v=await idbGet(k);
    S[k]=deepDef(v,DEF[k]);
  }
  normalizeEmoji();

  if(!S.sysCfg.glassVersion){
    S.sysCfg.widget.bg = '#ffffff';
    S.sysCfg.widget.alpha = 0.55;
    S.sysCfg.glassVersion = 1;
    idbSet('sysCfg', S.sysCfg);
  }
  S.sysCfg.theme.type = 'glass';

  applyFont();
  applySystemTheme();
  applyTheme();
  renderDesktop();
  renderChat();
  updateClock();
  updateBattery();
  setupDesktopInteractions();
  bindMiniDrag();
  tick();
  setInterval(tick,1000);
  
  setInterval(()=>{
    if(!$('#p-fortune').classList.contains('active')) return;
    if(S.fortune.lastDrawDate && S.fortune.lastDrawDate !== getTodayKey()){
      if(S.fortune.dailyLimit){
        _drawStage = 0;
        _pendingDraw = null;
        renderFortune();
      }
    }
  }, 60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden) tick();});
  window.addEventListener('focus',()=>tick());
  setInterval(()=>{keys.forEach(k=>idbSet(k,S[k]).catch(()=>{}));},300000);

  // === 监听通知点击与网址参数 (移到这里，确保数据已加载) ===
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', event => {
      if (event.data && event.data.action === 'openChat') {
        go('chat'); // 如果应用在后台，点击通知直接切到聊天页
      }
    });
  }
  
  // 如果是点击通知冷启动（网页原本没开）
  if (location.search.includes('action=chat')) {
    history.replaceState(null, '', location.pathname);
    setTimeout(() => go('chat'), 100); // 延迟一点点等渲染完成
  }
  // =====================================
}

boot().catch(e=>{
  console.error(e);
  document.body.innerHTML='<div style="padding:40px;font-size:14px;line-height:2">'+
    '初始化失败：'+esc(e.message)+'<br>请确认浏览器允许使用 IndexedDB。</div>';
});
</script>
