<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e8e2f3">
<title>你即宇宙</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;
  font-family:var(--user-font,-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif);
  color:var(--m-text,#5a4f6b)}
input,textarea,select,button{font-family:inherit;font-size:inherit;color:inherit}

/* ========== 玻璃质感主题变量 ========== */
:root{
  --m-bg:#e8e2f3;--m-bg-alt:#e0d9ed;--m-light:#ffffff;--m-dark:#bfb4d4;
  --m-text:#5a4f6b;--m-text-soft:#9388a8;--m-accent:#b8a5d8;--m-accent-soft:#d4c5e8;
  --neo-shadow:4px 6px 16px rgba(120,110,160,.26),-1px -1px 3px rgba(255,255,255,.5);
  --neo-shadow-sm:2px 3px 9px rgba(120,110,160,.22),-1px -1px 2px rgba(255,255,255,.45);
  --neo-shadow-lg:6px 10px 24px rgba(120,110,160,.3),-1px -1px 4px rgba(255,255,255,.55);
  --neo-inset:inset 2px 2px 5px rgba(120,110,160,.2),inset -1px -1px 3px rgba(255,255,255,.5);
  --neo-radius:24px;--neo-radius-sm:18px;
}

#phone{
  position:fixed;inset:0;overflow:hidden;background:var(--m-bg);
  --chat-top:rgba(232,226,243,.9);--chat-top-color:#5a4f6b;--chat-input:rgba(255,255,255,.85);
  --chat-input-color:#5a4f6b;--ts-color:#9388a8;--quote-bar:#b8a5d8;
  --bub-me-bg:#b8a5d8;--bub-me-color:#fff;--bub-me-radius:18px;
  --bub-ta-bg:#f3eefb;--bub-ta-color:#5a4f6b;--bub-ta-radius:18px;
  --sys-bg:rgba(212,197,232,.5);--sys-color:#9388a8;--sys-radius:12px;
  --wall-alpha:1;--call-bg:#e8e2f3;--call-color:#5a4f6b;
  --dock-bg:var(--m-bg);--dock-border:transparent;--dock-radius:28px;
  --dock-blur:0px;--dock-icon-size:44px;--dock-height:78px;
  --icon-size:60px;--icon-radius:22px;--icon-alpha:1;
  --desk-text:#5a4f6b;
}

.page{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;background:var(--m-bg);
  padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.page.active{display:flex}
.page.sub{display:flex;flex-direction:column;z-index:60;background:var(--m-bg);animation:slideUp .22s ease;padding-bottom:0}
.page.sub.sheet{top:auto;bottom:0;height:62vh;border-radius:24px 24px 0 0}
@keyframes slideUp{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
body.hide-dock #dock{display:none}
body.hide-dock .page:not(.sub){padding-bottom:0}

/* 桌面 */
#p-desktop{background:var(--m-bg)}
#deskColor{position:absolute;inset:0;z-index:0;background:var(--m-bg)}
#deskWall{position:absolute;inset:-20%;background-size:cover;background-position:center;z-index:0;
  pointer-events:none;transition:filter .25s,transform .25s;transform-origin:center}
.desk-content{position:relative;z-index:1;display:flex;flex-direction:column;flex:1;min-height:0}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 0;
  font-size:12px;font-weight:600;color:var(--m-text-soft);letter-spacing:.4px;flex:0 0 auto;z-index:12}
.bat{display:flex;align-items:center;gap:4px}
.bat-body{width:22px;height:11px;border:1.4px solid currentColor;border-radius:3px;position:relative;padding:1px}
.bat-body::after{content:'';position:absolute;right:-3.5px;top:2.5px;width:2px;height:5px;background:currentColor;border-radius:0 1px 1px 0}
.bat-fill{height:100%;background:currentColor;border-radius:1px;transition:width .3s}

/* 小组件：平面微透 */
#widget{margin:16px 18px 0;padding:18px 16px 16px;border-radius:var(--neo-radius);display:flex;flex-direction:column;align-items:center;
  position:relative;background:rgba(255,255,255,.55);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 4px 16px rgba(120,110,160,.12);
  transition:box-shadow .2s;touch-action:none;z-index:10;
  scrollbar-width:none;-ms-overflow-style:none}
#widget::-webkit-scrollbar{display:none;width:0;height:0}
#widget.dragging{box-shadow:0 10px 28px rgba(120,110,160,.22)}
.w-avatars{display:flex;align-items:center;justify-content:center;position:relative}
.w-av{width:56px;height:56px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.55);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 2px 8px rgba(120,110,160,.14);transition:width .15s,height .15s}
.w-av:nth-child(2){margin-left:-16px}
.w-time{font-size:36px;font-weight:200;letter-spacing:2px;margin-top:10px;color:var(--w-theme,var(--m-accent));line-height:1}
.w-text{font-size:12.5px;color:var(--m-text-soft);margin-top:8px;text-align:center;line-height:1.5}
.w-anniv{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.w-anniv span{font-size:11px;padding:4px 10px;border-radius:20px;
  background:rgba(255,255,255,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  color:var(--w-theme,var(--m-accent))}

#extraWidgets{position:absolute;inset:0;pointer-events:none;z-index:9}
.extra-widget{position:absolute;pointer-events:auto;display:flex;flex-direction:column;
  padding:12px 14px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 4px 16px rgba(120,110,160,.12);
  touch-action:none;overflow:hidden;transition:box-shadow .15s;scrollbar-width:none;-ms-overflow-style:none}
.extra-widget::-webkit-scrollbar{display:none;width:0;height:0}
.extra-widget.dragging{box-shadow:0 10px 28px rgba(120,110,160,.22);z-index:60}
.extra-widget .ew-title{font-size:12px;font-weight:600;color:var(--m-text-soft);margin-bottom:6px;text-align:center;flex:0 0 auto}
.extra-widget .ew-items{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;flex:1;overflow:hidden;gap:6px}
.extra-widget .ew-item{text-align:center;min-width:48px}
.extra-widget .ew-label{margin-bottom:2px;color:var(--m-text-soft);line-height:1.2}
.extra-widget .ew-value{font-weight:300;color:var(--m-accent);line-height:1.15}

.appgrid{position:relative;flex:1;min-height:340px;margin:0 14px;touch-action:none}
.app{position:absolute;left:0;top:0;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;
  touch-action:none;transition:filter .15s}
.app.dragging{z-index:60;filter:drop-shadow(0 14px 28px rgba(0,0,0,.28))}
.app-icon{width:var(--icon-size);height:var(--icon-size);border-radius:var(--icon-radius);
  background:rgba(255,255,255,.62);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--neo-shadow);
  opacity:var(--icon-alpha);overflow:hidden;transition:border-radius .2s,transform .15s,box-shadow .15s}
.app:active .app-icon{box-shadow:var(--neo-inset);transform:scale(.97)}
.app-icon svg{width:52%;height:52%;stroke:var(--m-accent);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.app-icon img{width:100%;height:100%;object-fit:cover}
.app-badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;
  border-radius:9px;background:#e86b6b;color:#fff;font-size:10px;font-weight:600;
  display:flex;align-items:center;justify-content:center;line-height:1;
  box-shadow:0 2px 6px rgba(200,80,80,.35);z-index:3;pointer-events:none;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.app-name{font-size:10.5px;color:var(--m-text-soft)}

/* 底栏 */
#dock{position:absolute;left:18px;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));
  height:var(--dock-height);border-radius:var(--dock-radius);display:flex;align-items:center;justify-content:space-around;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:var(--neo-shadow);
  z-index:45;transition:all .2s}
.dock-item{display:flex;align-items:center;justify-content:center;width:var(--dock-icon-size);height:var(--dock-icon-size);
  border-radius:30%;cursor:pointer;transition:transform .15s;touch-action:none;
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:var(--neo-shadow-sm)}
.dock-item:active{box-shadow:var(--neo-inset);transform:scale(.95)}
.dock-item.dragging{transition:none;opacity:.88;box-shadow:var(--neo-shadow-lg);z-index:40}
.dock-item svg{width:56%;height:56%;stroke:var(--m-accent);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.dock-item img{width:100%;height:100%;object-fit:cover;border-radius:30%}

/* 通用顶栏 */
.topbar{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 14px 14px;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  flex:0 0 auto;position:relative;z-index:5}
.topbar h2{margin:0;font-size:16px;font-weight:600;flex:1;text-align:center;color:var(--m-text)}
.icon-btn{width:38px;height:38px;border:none;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;border-radius:12px;cursor:pointer;padding:0;
  transition:all .15s;flex:0 0 auto;box-shadow:var(--neo-shadow-sm)}
.icon-btn:active{box-shadow:var(--neo-inset)}
.icon-btn svg{width:20px;height:20px;stroke:var(--m-text);fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.body-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}

/* 聊天 */
#p-chat{background:var(--m-bg)}
.chat-wall{position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:var(--wall-alpha);pointer-events:none;transition:opacity .2s;z-index:0}
.chat-top{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 12px 12px;
  background:var(--chat-top);color:var(--chat-top-color);position:relative;z-index:3;
  border-radius:0 0 18px 18px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 4px 12px rgba(140,130,170,.1)}
.chat-top .icon-btn{background:transparent;box-shadow:none}
.chat-top .icon-btn:active{background:rgba(0,0,0,.06)}
.chat-top .icon-btn svg{stroke:var(--chat-top-color)}
.chat-top #chatSetBtn{margin-left:auto}
.chat-top .ct-name{flex:0 1 auto;max-width:44%;font-size:15px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;text-align:left}
.chat-top .ct-status{position:absolute;left:50%;transform:translateX(-50%);
  display:none;align-items:center;gap:4px;font-size:11.5px;pointer-events:none;
  max-width:52%;overflow:hidden;white-space:nowrap}
.chat-top .ct-status.show{display:flex}
.chat-top .ct-status .status-text{display:inline-block;animation:pulseText 1.6s ease-in-out infinite}
@keyframes pulseText{0%,100%{opacity:.45;transform:scale(.97)}50%{opacity:1;transform:scale(1.02)}}
.chat-top .ct-status .dots{display:inline-flex;gap:2px;margin-left:2px}
.chat-top .ct-status .dots i{width:3px;height:3px;border-radius:50%;background:currentColor;
  animation:blink 1.2s infinite}
.chat-top .ct-status .dots i:nth-child(2){animation-delay:.2s}
.chat-top .ct-status .dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}

.chat-body{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:0;z-index:1}
.chat-list{position:relative;flex:1;overflow-y:auto;padding:14px 12px 18px;display:flex;
  flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.chat-list.multi{padding-left:34px;padding-right:34px}
.msg{display:flex;gap:8px;align-items:flex-start;animation:pop .18s ease;position:relative}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.me{flex-direction:row-reverse}
.msg .av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.55);flex:0 0 auto;
  box-shadow:var(--neo-shadow-sm)}
.msg .body{display:flex;flex-direction:column;max-width:72%;min-width:0;gap:4px}
.msg.me .body{align-items:flex-end}
.msg .body{align-items:flex-start}
.bubble{padding:10px 14px;font-size:14.5px;line-height:1.55;word-break:break-word;white-space:pre-wrap;
  position:relative;cursor:pointer}
.msg.me .bubble{background:var(--bub-me-bg);color:var(--bub-me-color);border-radius:var(--bub-me-radius);
  box-shadow:2px 4px 10px rgba(140,120,180,.28)}
.msg.ta .bubble{background:var(--bub-ta-bg);color:var(--bub-ta-color);border-radius:var(--bub-ta-radius);
  box-shadow:var(--neo-shadow-sm)}
/* 木质特殊气泡 */
.bubble.wood{
  background: linear-gradient(145deg, #8a6a4a 0%, #6b5038 60%, #5a4230 100%);
  color:#f5e6d3;
  border:1px solid #4a3524;
  border-radius:12px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    inset 0 -1px 0 rgba(0,0,0,.25),
    0 3px 10px rgba(0,0,0,.28);
  font-family:"STKaiti","KaiTi","Kaiti SC",serif;
  letter-spacing:1px;
  font-size:14px;
  padding:12px 16px;
  text-shadow:0 1px 0 rgba(0,0,0,.3);
}
.msg.me .bubble.wood{
  background: linear-gradient(145deg, #8a6a4a 0%, #6b5038 60%, #5a4230 100%);
  color:#f5e6d3;
}

.bubble img.msg-img{max-width:190px;border-radius:10px;display:block}
.bubble img.msg-emoji{width:88px;height:88px;object-fit:contain;display:block;background:transparent}
.bubble .quote{font-size:12px;padding:6px 9px;margin-bottom:6px;border-radius:8px;
  background:rgba(184,165,216,.12);opacity:.85;border-left:3px solid var(--quote-bar,#b8a5d8);
  white-space:pre-wrap}
.msg .ts{font-size:10px;color:var(--ts-color);padding:0 2px}
.msg .heart{position:absolute;right:6px;bottom:-2px;font-size:11px;opacity:.85}
.msg.sys{justify-content:center;width:100%}
.sys-msg{background:var(--sys-bg);color:var(--sys-color);border-radius:var(--sys-radius);
  padding:7px 14px;font-size:11.5px;text-align:center;max-width:82%;line-height:1.5;
  box-shadow:var(--neo-inset)}
.sys-msg em{font-style:normal;text-decoration:underline;margin-left:6px;opacity:.85}
.msg .msg-cb{position:absolute;top:12px;left:-26px;width:18px;height:18px;z-index:3;
  accent-color:var(--m-accent);pointer-events:none}
.msg.me .msg-cb{left:auto;right:-26px}

.chat-input-wrap{flex:0 0 auto;display:flex;flex-direction:column;z-index:3}
.quote-bar{display:flex;align-items:center;gap:8px;padding:9px 14px;
  background:var(--chat-input);font-size:12px;color:var(--m-text-soft)}
.quote-bar .qb-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border-left:3px solid var(--quote-bar,#b8a5d8);padding-left:9px}
.quote-bar .qb-close{border:none;background:transparent;font-size:16px;color:var(--m-text-soft);
  cursor:pointer;padding:0 4px;line-height:1}

.chat-bottom{display:flex;align-items:center;gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--chat-input);flex:0 0 auto;border-radius:18px 18px 0 0}
.chat-bottom input[type=text]{flex:1;min-width:0;border:none;outline:none;
  background:rgba(255,255,255,.7);border-radius:22px;padding:11px 16px;font-size:14.5px;color:var(--chat-input-color);
  box-shadow:var(--neo-inset);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cb-btn{width:38px;height:38px;flex:0 0 auto;border:none;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  box-shadow:var(--neo-shadow-sm);transition:all .15s}
.cb-btn:active{box-shadow:var(--neo-inset);transform:scale(.95)}
.cb-btn svg{width:19px;height:19px;stroke:var(--m-accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* 消息操作卡片 */
.msg-action{position:fixed;z-index:450;display:flex;gap:4px;padding:6px;border-radius:16px;
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:var(--neo-shadow-lg);animation:pop .14s ease}
.msg-action button{border:none;background:transparent;padding:9px 14px;border-radius:10px;
  font-size:13px;color:var(--m-text);cursor:pointer;white-space:nowrap}
.msg-action button:active{background:rgba(184,165,216,.15)}
.msg-action button[data-act="del"]{color:#c06b6b}

/* 多选栏 */
.multi-bar{position:absolute;left:0;right:0;bottom:0;z-index:20;display:none;
  align-items:center;justify-content:space-between;gap:8px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 -6px 18px rgba(150,140,180,.15)}
.multi-bar.show{display:flex}

/* 通话弹窗 */
#callOverlay{position:fixed;inset:0;z-index:600;display:none;align-items:center;justify-content:center;
  background:rgba(90,79,107,.22);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#callOverlay.show{display:flex}
#callCard{width:280px;max-width:86vw;border-radius:32px;padding:28px 20px 24px;text-align:center;position:relative;
  overflow:hidden;
  background:rgba(255,255,255,.7);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  color:var(--m-text);box-shadow:var(--neo-shadow-lg)}
#callBg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.5;z-index:0}
#callCard > *:not(#callBg){position:relative;z-index:1}
.call-av{width:76px;height:76px;border-radius:50%;object-fit:cover;
  box-shadow:var(--neo-shadow-lg);background:rgba(255,255,255,.55)}
.call-name{font-size:17px;font-weight:600;margin-top:12px;color:var(--m-text)}
.call-status{font-size:12px;color:var(--m-text-soft);margin-top:6px;min-height:16px}
.call-actions{display:flex;gap:36px;justify-content:center;margin-top:24px}
.call-btn{width:56px;height:56px;border-radius:50%;border:none;font-size:13px;cursor:pointer;
  box-shadow:var(--neo-shadow);font-weight:500;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.call-btn:active{box-shadow:var(--neo-inset)}
.call-btn.reject{background:rgba(242,214,214,.85);color:#c06b6b}
.call-btn.accept{background:rgba(216,232,220,.85);color:#6b9b7c}
.call-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* 通话小窗 */
#callMini{position:fixed;right:14px;bottom:110px;z-index:610;display:none;
  width:170px;height:50px;border-radius:25px;align-items:center;gap:8px;padding:5px 6px 5px 5px;
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:var(--neo-shadow-lg);
  color:var(--m-text);touch-action:none;overflow:hidden}
#callMini.show{display:flex}
#callMini .mini-av{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:0 0 auto;
  background:rgba(255,255,255,.55);position:relative;z-index:1}
#callMini .mini-info{flex:1;min-width:0;position:relative;z-index:1}
#callMini .mini-name{font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#callMini .mini-time{font-size:10px;color:var(--m-text-soft);margin-top:1px}
#callMini .mini-hang{width:32px;height:32px;border-radius:50%;border:none;
  background:rgba(242,214,214,.9);color:#c06b6b;cursor:pointer;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;padding:0;
  position:relative;z-index:2;box-shadow:var(--neo-shadow-sm)}
#callMini .mini-hang svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* 字卡库 */
.cards-menu{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:16px 14px}
.cm-item{display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer}
.cm-ico{width:100%;aspect-ratio:1;max-width:62px;border-radius:20px;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--neo-shadow);transition:all .15s}
.cm-item:active .cm-ico{box-shadow:var(--neo-inset)}
.cm-ico svg{width:50%;height:50%;stroke:var(--m-accent);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cm-item span{font-size:11px;color:var(--m-text-soft)}
.searchbox{margin:0 14px;display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:18px;padding:11px 15px;box-shadow:var(--neo-inset)}
.searchbox input{border:none;outline:none;flex:1;background:transparent;font-size:14px;color:var(--m-text)}

/* 信件 */
.letter-tabs{display:flex;gap:12px;margin-bottom:14px}
.letter-tab-card{flex:1;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:20px;padding:16px 10px;text-align:center;
  box-shadow:var(--neo-shadow);cursor:pointer;transition:all .15s}
.letter-tab-card:active{box-shadow:var(--neo-inset)}
.letter-tab-card.on{box-shadow:var(--neo-inset)}
.letter-tab-card .lt-name{font-size:13px;font-weight:600;color:var(--m-text)}
.letter-tab-card .lt-count{font-size:26px;font-weight:200;color:var(--m-accent);margin-top:4px;line-height:1.2}
.letter-list{min-height:120px}

/* 通用组件 */
.card{
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:var(--neo-radius);padding:16px;margin-bottom:14px;
  box-shadow:var(--neo-shadow)}
.card h3{margin:0 0 12px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:space-between;color:var(--m-text)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;
  border-bottom:1px solid rgba(184,165,216,.15);font-size:13.5px}
.row:last-child{border-bottom:none}
.row>span{color:var(--m-text);flex:0 0 auto}
.row input[type=number],.row input[type=text],.row select{width:88px;text-align:right;border:none;outline:none;
  background:rgba(255,255,255,.55);border-radius:10px;padding:7px 10px;font-size:13.5px;color:var(--m-text);
  box-shadow:var(--neo-inset)}
.row select{width:auto;min-width:88px}
.row input[type=range]{flex:1;max-width:150px;accent-color:var(--m-accent);background:transparent}
.row .rv{font-size:12px;color:var(--m-text-soft);min-width:38px;text-align:right}
.btn{border:none;border-radius:14px;padding:11px 18px;font-size:13.5px;cursor:pointer;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:var(--m-text);transition:all .15s;font-weight:500;
  box-shadow:var(--neo-shadow-sm)}
.btn:active{box-shadow:var(--neo-inset);transform:scale(.97)}
.btn.primary{background:var(--m-accent);color:#fff;
  box-shadow:2px 3px 8px rgba(120,110,160,.28)}
.btn.primary:active{box-shadow:inset 2px 2px 4px rgba(0,0,0,.14);transform:scale(.97)}
.btn.danger{background:#f2d6d6;color:#c06b6b;backdrop-filter:none;-webkit-backdrop-filter:none}
.btn.danger:active{box-shadow:inset 2px 2px 4px rgba(160,80,80,.18);transform:scale(.97)}
.btn.block{width:100%;display:block;margin-top:8px}
.btn.sm{padding:7px 13px;font-size:12px;border-radius:11px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:12px;color:var(--m-text-soft);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:none;outline:none;
  background:rgba(255,255,255,.55);border-radius:12px;padding:11px 13px;font-size:14px;color:var(--m-text);
  box-shadow:var(--neo-inset);resize:vertical}

.overlay{position:fixed;inset:0;z-index:500;background:rgba(90,79,107,.3);backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:22px;
  animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-radius:24px;width:100%;max-width:400px;max-height:82vh;display:flex;
  flex-direction:column;overflow:hidden;box-shadow:var(--neo-shadow-lg);animation:pop .2s ease}
.m-head{display:flex;align-items:center;padding:18px 18px 12px;gap:10px}
.m-head h3{margin:0;font-size:15.5px;font-weight:600;flex:1;color:var(--m-text)}
.m-head button{border:none;background:transparent;font-size:16px;color:var(--m-text-soft);cursor:pointer;padding:4px}
.m-body{padding:4px 18px 14px;overflow-y:auto;flex:1;font-size:14px;color:var(--m-text)}
.m-foot{padding:12px 18px 18px;display:flex;gap:10px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  color:var(--m-text);padding:12px 22px;border-radius:22px;font-size:13px;
  z-index:900;opacity:0;transition:.25s;pointer-events:none;max-width:80%;text-align:center;
  box-shadow:var(--neo-shadow-lg)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sub-body{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:10px;padding:14px;background:transparent}
.tab{flex:1;text-align:center;padding:11px;border-radius:14px;font-size:13.5px;
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  cursor:pointer;color:var(--m-text-soft);box-shadow:var(--neo-shadow-sm);transition:.15s}
.tab.on{background:var(--m-accent);color:#fff;box-shadow:2px 3px 8px rgba(120,110,160,.28);font-weight:600}
.list-item{
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:18px;padding:14px 16px;margin-bottom:12px;font-size:14px;
  box-shadow:var(--neo-shadow);display:flex;align-items:center;gap:10px;color:var(--m-text);
  transition:box-shadow .15s}
.list-item:active{box-shadow:var(--neo-inset)}
.list-item .li-main{flex:1;min-width:0;cursor:pointer}
.list-item .li-sub{font-size:11px;color:var(--m-text-soft);margin-top:4px}
.emoji-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.emoji-grid img{width:100%;aspect-ratio:1;object-fit:contain;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:16px;padding:8px;box-shadow:var(--neo-shadow-sm)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:20px;
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-size:12.5px;box-shadow:var(--neo-shadow-sm);margin:0 8px 8px 0;cursor:pointer;color:var(--m-text)}
.chip.on{background:var(--m-accent);color:#fff;box-shadow:2px 3px 8px rgba(120,110,160,.28)}
.chip-x{font-size:14px;opacity:.5;padding:0 2px;border:none;background:transparent;cursor:pointer;color:inherit}
.hscroll{display:flex;overflow-x:auto;gap:8px;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
.avpick{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.avpick img{width:56px;height:56px;border-radius:50%;object-fit:cover;
  background:rgba(255,255,255,.55);cursor:pointer;
  box-shadow:var(--neo-shadow-sm)}
.colorin{width:40px;height:40px;border:none;padding:0;background:transparent;border-radius:50%;overflow:hidden;cursor:pointer;
  box-shadow:var(--neo-shadow-sm)}
.colorin::-webkit-color-swatch-wrapper{padding:0}
.colorin::-webkit-color-swatch{border:2px solid var(--m-bg);border-radius:50%}
.switch{width:46px;height:27px;border-radius:20px;background:rgba(255,255,255,.5);position:relative;transition:.2s;cursor:pointer;flex:0 0 auto;
  box-shadow:var(--neo-inset)}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
  background:#fff;transition:.2s;box-shadow:var(--neo-shadow-sm)}
.switch.on{background:var(--m-accent)}
.switch.on::after{left:22px;background:#fff}
.badge{font-size:10px;background:rgba(255,255,255,.55);color:var(--m-text-soft);padding:2px 8px;border-radius:8px;margin-left:6px;
  box-shadow:var(--neo-inset)}
.small{font-size:11.5px;color:var(--m-text-soft);line-height:1.6}
.empty{text-align:center;color:var(--m-text-soft);font-size:13px;padding:38px 0}

/* 浮动美化面板 */
.float-panel{position:fixed;left:12px;right:12px;bottom:100px;z-index:400;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-radius:22px;box-shadow:var(--neo-shadow-lg);
  display:flex;flex-direction:column;max-height:58vh;overflow:hidden;transition:max-height .22s ease}
.float-panel.collapsed{max-height:52px}
.fp-head{display:flex;align-items:center;gap:6px;padding:10px 12px;cursor:grab;
  touch-action:none;flex:0 0 auto;min-height:52px}
.fp-head:active{cursor:grabbing}
.fp-grip{width:18px;height:18px;display:flex;align-items:center;justify-content:center;opacity:.5;flex:0 0 auto}
.fp-grip::before{content:'';width:12px;height:2px;background:var(--m-text-soft);border-radius:2px;
  box-shadow:0 -4px 0 var(--m-text-soft),0 4px 0 var(--m-text-soft)}
.fp-title{flex:1;font-size:14px;font-weight:600;color:var(--m-text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp-btn{border:none;background:rgba(255,255,255,.55);border-radius:11px;padding:6px 11px;font-size:12px;
  color:var(--m-text);cursor:pointer;flex:0 0 auto;box-shadow:var(--neo-shadow-sm)}
.fp-btn:active{box-shadow:var(--neo-inset)}
.fp-body{overflow-y:auto;padding:12px 14px 18px;flex:1;-webkit-overflow-scrolling:touch}
.float-panel.collapsed .fp-body{display:none}
/* 互动合集图标网格 */
.interact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px;padding:8px 0 12px}
.interact-item{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.interact-ico{width:58px;height:58px;border-radius:18px;
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--neo-shadow-sm);transition:all .15s}
.interact-item:active .interact-ico{box-shadow:var(--neo-inset);transform:scale(.94)}
.interact-ico svg{width:26px;height:26px;stroke:var(--m-accent);fill:none;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.interact-item span{font-size:11px;color:var(--m-text-soft);text-align:center;line-height:1.2}

/* 主题选择 */
.preset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 10px}
.preset-opt{padding:12px 6px;border-radius:14px;text-align:center;font-size:11px;cursor:pointer;
  box-shadow:var(--neo-shadow-sm);transition:.15s;font-weight:500}
.preset-opt:active{transform:scale(.97)}

/* ========== 双人签 APP 样式 ========== */
#p-fortune{background:var(--m-bg);padding-bottom:0}
#p-fortune .body-scroll{padding:0}
.fortune-toolbar{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;
  font-size:12.5px;color:var(--m-text-soft);gap:10px}
.fortune-toolbar .ft-sw{display:flex;align-items:center;gap:8px}
.fortune-toolbar .btn{font-size:11.5px;padding:6px 12px}
.fortune-banner{margin:0 14px 10px;padding:9px 14px;border-radius:14px;font-size:12px;text-align:center;
  background:rgba(212,175,55,.13);color:#8a6a1f;border:1px solid rgba(212,175,55,.28)}

.fortune-draw-wrap{padding:10px 16px 24px;display:flex;flex-direction:column;align-items:center}
.fortune-tip{font-size:12.5px;color:var(--m-text-soft);margin-top:6px;text-align:center;line-height:1.6}

.fortune-cards{display:flex;gap:22px;justify-content:center;margin:26px 0 24px;perspective:1200px}
.fortune-card{
  width:118px;height:166px;position:relative;cursor:pointer;
  transform-style:preserve-3d;transition:transform .75s cubic-bezier(.4,.05,.25,1);
  -webkit-tap-highlight-color:transparent;
}
.fortune-card.flipped{transform:rotateY(180deg)}
.fortune-card.disabled{cursor:default}
.fortune-card.same-pulse{animation:goldenPulse 2s ease-out}
@keyframes goldenPulse{
  0%{filter:drop-shadow(0 0 0 rgba(255,215,0,0))}
  40%{filter:drop-shadow(0 0 26px rgba(255,215,0,.85))}
  100%{filter:drop-shadow(0 0 14px rgba(255,215,0,.45))}
}
.fortune-card .fc-back,
.fortune-card .fc-face{
  position:absolute;inset:0;border-radius:12px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;
}
.fortune-card .fc-back{
  border:1px solid #3a2718;
  box-shadow:inset 0 0 22px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.35);
}
.fortune-card .fc-back.left-wood{
  background: linear-gradient(135deg, #4a3424 0%, #2b1c10 100%);
}
.fortune-card .fc-back.right-wood{
  background: linear-gradient(135deg, #3d2a1c 0%, #231609 100%);
}
.fortune-card .fc-back::after{
  content:"?";
  font-family:"STKaiti","KaiTi",serif;font-size:36px;
  color:rgba(212,175,55,.35);letter-spacing:2px;
}
.fortune-card .fc-face{
  transform:rotateY(180deg);
  background: linear-gradient(145deg, #faf0d8 0%, #ecd9ae 100%);
  border:1px solid #b89860;
  box-shadow:inset 0 0 18px rgba(180,140,80,.2),0 3px 10px rgba(0,0,0,.18);
  color:#4a3524;
}
.fortune-card .fc-char{
  font-family:"STKaiti","KaiTi","Kaiti SC",serif;
  font-size:54px;font-weight:500;line-height:1;
  text-shadow:0 1px 0 rgba(255,255,255,.6);
}
.fortune-card .fc-xiang{
  font-family:"STKaiti","KaiTi",serif;
  font-size:10px;opacity:.72;text-align:center;padding:8px 8px 0;line-height:1.4;
}
.fortune-card.same .fc-face{
  box-shadow:inset 0 0 22px rgba(212,175,55,.35),0 0 20px rgba(212,175,55,.45),0 3px 10px rgba(0,0,0,.18);
  border-color:#d4af37;
}

.fortune-title{
  display:none;flex-direction:column;align-items:center;gap:8px;
  padding:16px 22px;border-radius:16px;cursor:pointer;
  background:rgba(250,240,216,.55);
  border:1px solid rgba(184,152,96,.35);
  box-shadow:0 4px 14px rgba(120,90,50,.12);
  animation:fadeUp .5s ease;
  max-width:340px;
  text-align:center;
}
.fortune-title.show{display:flex}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ft-id{font-family:"STKaiti","KaiTi",serif;font-size:22px;letter-spacing:4px;color:#5a4230;font-weight:600}
.ft-reading{font-family:"STKaiti","KaiTi",serif;font-size:15px;color:#4a3524;letter-spacing:1.5px}
.ft-hint{font-size:11px;color:var(--m-text-soft);margin-top:2px}

.fortune-actions{display:none;gap:10px;margin-top:20px;flex-wrap:wrap;justify-content:center}
.fortune-actions.show{display:flex}
.fortune-actions .btn{font-size:12.5px;padding:9px 16px}
.fortune-actions .btn:disabled{opacity:.45;cursor:not-allowed}

/* 合解浮层 */
#fortuneReadingOverlay{position:fixed;inset:0;z-index:520;
  display:none;align-items:center;justify-content:center;padding:22px;
  background:rgba(40,30,20,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  animation:fade .3s ease}
#fortuneReadingOverlay.show{display:flex}
.reading-card{
  background: linear-gradient(145deg, #faf0d8 0%, #f0dfb8 100%);
  color:#4a3524;
  border-radius:20px;padding:24px 22px 20px;
  max-width:360px;width:100%;
  border:2px solid #c9a86a;
  box-shadow:0 22px 52px rgba(0,0,0,.32),inset 0 0 30px rgba(180,140,80,.12);
  animation:readingIn .45s ease;
  max-height:82vh;overflow-y:auto;
}
@keyframes readingIn{from{opacity:0;transform:scale(.92) translateY(16px)}to{opacity:1;transform:none}}
.reading-badge{font-size:11px;color:#8a6a1f;text-align:center;margin-bottom:12px;
  padding:5px 12px;border-radius:20px;display:inline-block;
  background:rgba(212,175,55,.15);border:1px solid rgba(212,175,55,.3);
  margin-left:50%;transform:translateX(-50%)}
.reading-badge.fresh{background:rgba(212,175,55,.28);color:#6b5030;border-color:#d4af37}
.reading-id{font-family:"STKaiti","KaiTi",serif;font-size:26px;letter-spacing:6px;
  text-align:center;font-weight:600;color:#5a4230;margin-bottom:8px}
.reading-id.same{color:#8a6a1f;text-shadow:0 0 12px rgba(212,175,55,.4)}
.reading-text{font-family:"STKaiti","KaiTi",serif;font-size:16px;letter-spacing:2px;
  text-align:center;color:#4a3524;line-height:1.8;margin-bottom:20px;
  padding-bottom:18px;border-bottom:1px dashed rgba(184,152,96,.35)}
.reading-xiang{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.reading-xiang .xiang-row{display:flex;align-items:flex-start;gap:12px}
.reading-xiang .xiang-char{
  width:44px;height:44px;flex:0 0 auto;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-family:"STKaiti","KaiTi",serif;font-size:22px;font-weight:600;
  background:linear-gradient(145deg, #f5e6c8, #e8d4a8);
  border:1px solid #b89860;color:#4a3524;
  box-shadow:inset 0 0 8px rgba(180,140,80,.15);
}
.reading-xiang .xiang-meta{flex:1;min-width:0;padding-top:6px}
.reading-xiang .xiang-label{font-size:10.5px;color:#8a6a1f;margin-bottom:4px;letter-spacing:.5px}
.reading-xiang .xiang-text{font-family:"STKaiti","KaiTi",serif;font-size:13.5px;color:#4a3524;line-height:1.5;letter-spacing:.5px}
.reading-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.reading-actions .btn{font-size:12.5px;padding:9px 16px}

/* 签文阁 */
.fortune-book-wrap{padding:0 14px 24px}
.book-tabs{display:flex;gap:10px;padding:12px 4px}
.book-tabs .tab{font-size:12.5px;padding:9px;border-radius:12px}
.book-progress{text-align:center;font-size:12px;color:var(--m-text-soft);margin-bottom:12px;letter-spacing:.5px}
.book-grid{
  display:grid;gap:5px;padding:12px;border-radius:18px;
  background:rgba(60,42,28,.18);
  border:1px solid rgba(120,90,50,.2);
  box-shadow:inset 0 2px 8px rgba(0,0,0,.12);
}
.book-cell{
  aspect-ratio:1;border-radius:6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:"STKaiti","KaiTi",serif;
  transition:all .18s;position:relative;
  font-size:11px;line-height:1.15;font-weight:600;
}
.book-cell.undrawn{
  background: linear-gradient(145deg, #3d2b1f, #1f140c);
  border:1px solid #3a2718;
  color:rgba(212,175,55,.28);
  box-shadow:inset 0 0 8px rgba(0,0,0,.4);
  cursor:default;
}
.book-cell.undrawn::before{content:"✦";font-size:10px;opacity:.55}
.book-cell.drawn{
  background:linear-gradient(145deg, #faf0d8, #e8d4a8);
  border:1px solid #b89860;
  color:#4a3524;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 3px rgba(0,0,0,.15);
  cursor:pointer;
}
.book-cell.drawn.same{
  border:1px solid #d4af37;
  box-shadow:inset 0 0 8px rgba(212,175,55,.3),0 0 8px rgba(212,175,55,.4);
}
.book-cell.drawn:active{transform:scale(.94)}

function hexA(hex,alpha){
  if(!hex) return 'transparent';
  if(hex[0]==='#'){let h=hex.slice(1);if(h.length===3)h=h.split('').map(c=>c+c).join('');
    const n=parseInt(h,16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${alpha})`;}
  return hex;
}
function shade(hex,p){
  if(!hex||hex[0]!=='#') return hex||'#000';
  let h=hex.slice(1);if(h.length===3)h=h.split('').map(c=>c+c).join('');
  let r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  r=clamp(r+p,0,255);g=clamp(g+p,0,255);b=clamp(b+p,0,255);
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}

/* 音效 */
let _actx;
function ensureCtx(){try{_actx=_actx||new (window.AudioContext||window.webkitAudioContext)();
  if(_actx.state==='suspended') _actx.resume();}catch(e){}return _actx;}
function playPreset(id){
  const ctx=ensureCtx();if(!ctx) return;
  const make=(freq,type,dur,vol,slideTo,delay=0)=>{try{const t0=ctx.currentTime+delay;
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'sine';
    o.frequency.setValueAtTime(freq,t0);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur*0.7);
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||0.05,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(ctx.destination);o.start(t0);o.stop(t0+dur+0.05);}catch(e){}};
  switch(id){
  case 'r1': make(880,'sine',0.28,0.42,1320); break;
case 'r2': make(660,'triangle',0.35,0.4,null,0); make(990,'triangle',0.3,0.30,null,0.12); break;
case 'r3': make(1200,'sine',0.4,0.42,600); break;
case 'c1': make(560,'sine',1,0.6,680); break;
case 'c2': make(440,'triangle',0.9,0.6,660); break;
case 'c3': make(784,'sine',0.9,0.6,523); break;
}
}
function playSound(kind){
  const ui=S.chatCfg.ui;
  const src=kind==='call'?ui.soundCall:ui.soundReply;
  if(!src){ensureCtx();playPreset(kind==='call'?'c1':'r1');return;}
  if(src.startsWith('data:')){try{const a=new Audio(src);a.volume=1;a.play().catch(()=>{});}catch(e){}return;}
  playPreset(src);
}
let _ringTimer=null;
function getRingDuration(){
  const src=S.chatCfg.ui.soundCall;
  if(!src) return 420;
  if(src.startsWith('data:')) return 1500;
  switch(src){
    case 'c1': return 420;
    case 'c2': return 920;
    case 'c3': return 450;
    default: return 420;
  }
}
function startRingLoop(){
  stopRingLoop();

    playSound('call');

}
function stopRingLoop(){
  if(_ringTimer){clearTimeout(_ringTimer);_ringTimer=null;}
}

/* IndexedDB */
const DB_NAME='nijiyuzhou', STORE='kv';
let _db=null;
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE);};
  r.onsuccess=e=>{_db=e.target.result;res();};
  r.onerror=e=>rej(e);
});}
function idbGet(k){return new Promise((res,rej)=>{const q=_db.transaction(STORE).objectStore(STORE).get(k);
  q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
function idbSet(k,v){return new Promise((res,rej)=>{const q=_db.transaction(STORE,'readwrite').objectStore(STORE).put(v,k);
  q.onsuccess=()=>res();q.onerror=()=>rej(q.error);});}
function idbClear(){return new Promise(res=>{const q=_db.transaction(STORE,'readwrite').objectStore(STORE).clear();
  q.onsuccess=()=>res();});}

function deepDef(obj,def){
  if(Array.isArray(def)) return Array.isArray(obj)?obj:def.slice();
  if(def&&typeof def==='object'){
    const o=(obj&&typeof obj==='object')?obj:{};
    const r={};
    for(const k in def) r[k]=deepDef(o[k],def[k]);
    for(const k in o) if(!(k in r)) r[k]=o[k];
    return r;
  }
  return obj===undefined?def:obj;
}

function go(id,fromBack){
  const cur=$('.page.active:not(.sub)');
  const same=cur&&cur.id==='p-'+id;
  $$('.page').forEach(p=>p.classList.remove('active'));
  const el=$('#p-'+id);
  if(el) el.classList.add('active');
  document.body.classList.toggle('hide-dock',APPS_NO_DOCK.includes(id));
  if(!same && id!=='desktop' && !fromBack){history.pushState({guard:1},'');}
  if(id==='desktop') renderDesktop();
  if(id==='chat'){
  S.unread = S.unread || {chat:0,letter:0};
  S.unread.chat = 0; save('unread');
  chatRenderLimit = 15; // <--- 新增这行：每次进聊天，先只显示最近 15 条
  renderChat(); applyTheme();
}
  if(id==='seek') renderSeek();
  if(id==='letter'){
    S.unread = S.unread || {chat:0,letter:0};
    S.unread.letter = 0; save('unread');
    renderLetter();
  }
  if(id==='you') renderYou();
  if(id==='cards') renderCardsApp();
  if(id==='settings') renderSettings();
  if(id==='fortune') renderFortune();
}

function openSub(title,html,opt={}){
  if(opt.behind) go(opt.behind);
  const el=document.createElement('div');
  el.className='page sub'+(opt.sheet?' sheet':'');
  el._onClose=opt.onClose;
  el.innerHTML=`<div class="topbar">
      <button class="icon-btn" data-sback>${SVG.back}</button>
      <h2>${esc(title)}</h2><div style="width:38px"></div>
    </div>
    <div class="sub-body">${html}</div>`;
  document.body.appendChild(el);
  el.querySelector('[data-sback]').onclick=()=>history.back();
  history.pushState({sub:1},'');
  opt.onMount&&opt.onMount(el);
  return el;
}
function showModal(html,opt={}){
  const ov=document.createElement('div');
  ov.className='overlay';
  ov._onClose=opt.onClose;
  ov.innerHTML=`<div class="modal" style="${opt.width?'max-width:'+opt.width:' '}">${html}</div>`;
  document.body.appendChild(ov);
  const close=()=>{ov.remove();opt.onClose&&opt.onClose();};
  ov.addEventListener('click',e=>{if(e.target===ov) close();});
  ov.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  ov.close=close;
  return ov;
}

function openFloatPanel(title,html,opt={}){

  el.innerHTML=`
    <div class="fp-head">

  document.body.appendChild(el);
  if(opt.bottom) el.style.bottom=opt.bottom+'px';
  el.querySelector('[data-fp-close]').onclick=()=>el.remove();
  el.querySelector('[data-fp-toggle]').onclick=(e)=>{
    el.classList.toggle('collapsed');
    e.target.textContent=el.classList.contains('collapsed')?'展开':'收起';
  };
  makeDraggable(el,el.querySelector('.fp-head'));
  return el;
}
function makeDraggable(el,handle){
  let dragging=false,sx=0,sy=0,ox=0,oy=0;
  const start=(e)=>{
    if(e.target.closest('.fp-btn')) return;
    dragging=true;
    const p=e.touches?e.touches[0]:e;
    sx=p.clientX;sy=p.clientY;
    const r=el.getBoundingClientRect();
    ox=r.left;oy=r.top;
    el.style.transition='none';e.preventDefault();
  };
  const move=(e)=>{
    if(!dragging) return;
    const p=e.touches?e.touches[0]:e;
    const dx=p.clientX-sx,dy=p.clientY-sy;
    el.style.left=clamp(ox+dx,4,innerWidth-el.offsetWidth-4)+'px';
    el.style.top=clamp(oy+dy,4,innerHeight-60)+'px';
    el.style.bottom='auto';el.style.right='auto';e.preventDefault();
  };
  const end=()=>{dragging=false;el.style.transition='';};
  handle.addEventListener('touchstart',start,{passive:false});
  handle.addEventListener('mousedown',start);
  window.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('mousemove',move);
  window.addEventListener('touchend',end);
  window.addEventListener('mouseup',end);
}

function annivText(a){const p=annivParts(a);return p.label+' '+p.value;}
function annivParts(a){
  const d0=new Date(a.date+'T00:00:00').getTime();
  if(a.type==='恋爱时长'){
    const days=Math.floor((now()-d0)/86400000);
    return {label:a.name,value:days+'天'};
  }
  const d=new Date(a.date+'T00:00:00');
  const today=new Date();today.setHours(0,0,0,0);
  let next=new Date(today.getFullYear(),d.getMonth(),d.getDate());
  if(next.getTime()<today.getTime()) next=new Date(today.getFullYear()+1,d.getMonth(),d.getDate());
  const days=Math.round((next.getTime()-today.getTime())/86400000);
  return {label:a.name,value:'还有'+days+'天'};
}

function bindExtraWidgetDrag(){

    const wid = el.dataset.wid;
    let pressTimer=null, dragging=false, startX=0, startY=0, baseX=0, baseY=0;
    el.addEventListener('touchstart', e => {
      const t = e.touches[0];
      startX = t.clientX; startY = t.clientY;
      const w = S.sysCfg.widgets.find(x=>x.id===wid);
      if(!w) return;
      const off = w.offset || {x:0,y:0};
      baseX = off.x; baseY = off.y;
      clearTimeout(pressTimer);
      pressTimer = setTimeout(() => {
        dragging = true; el.classList.add('dragging');
        if(navigator.vibrate) navigator.vibrate(15);
      }, 450);
    }, {passive:true});
    el.addEventListener('touchmove', e => {
      if(!dragging) return;
      e.preventDefault();
      const t = e.touches[0];
      el.style.left = (baseX + t.clientX - startX) + 'px';
      el.style.top = (baseY + t.clientY - startY) + 'px';
    }, {passive:false});
    const end = () => {
      clearTimeout(pressTimer);
      if(!dragging) return;
      dragging = false; el.classList.remove('dragging');
      const w = S.sysCfg.widgets.find(x=>x.id===wid);
      if(w){w.offset = {x: parseFloat(el.style.left)||0, y: parseFloat(el.style.top)||0};save('sysCfg');}
    };
    el.addEventListener('touchend', end);
    el.addEventListener('touchcancel', end);
  });
}

/* 桌面拖拽 */
function setupAppFreeDrag(){
  const ag = $('#appgrid');
  if(ag._dragBound) return;
  ag._dragBound = true;
  let pressTimer=null, dragEl=null, startEl=null, moved=false;
  let sx=0, sy=0, baseLeft=0, baseTop=0;
  const getPoint=e=>e.touches?e.touches[0]:e;
  ag.addEventListener('touchstart', e=>{
    const el=e.target.closest('.app');
    if(!el) return;
    const p=getPoint(e);sx=p.clientX; sy=p.clientY;moved=false; startEl=el;
    const gr=ag.getBoundingClientRect();const r=el.getBoundingClientRect();
    baseLeft=r.left-gr.left+r.width/2;baseTop=r.top-gr.top;
    clearTimeout(pressTimer);
    pressTimer=setTimeout(()=>{dragEl=el;el.classList.add('dragging');
      if(navigator.vibrate) navigator.vibrate(15);}, 450);
  }, {passive:true});
  ag.addEventListener('touchmove', e=>{
    const p=getPoint(e);
    if(!dragEl){if(Math.abs(p.clientX-sx)>8||Math.abs(p.clientY-sy)>8){moved=true;clearTimeout(pressTimer);}return;}
    e.preventDefault();
    const dx=p.clientX-sx, dy=p.clientY-sy;
    const gr=ag.getBoundingClientRect();
    dragEl.style.left=clamp(baseLeft+dx, 22, gr.width-22)+'px';
    dragEl.style.top=clamp(baseTop+dy, 0, gr.height-60)+'px';
  }, {passive:false});
  const end=()=>{
    clearTimeout(pressTimer);
    if(dragEl){
      const el=dragEl; dragEl=null;
      el.classList.remove('dragging');
      const gr=ag.getBoundingClientRect();const r=el.getBoundingClientRect();
      const cx=r.left+r.width/2-gr.left;const xPct=cx/gr.width*100;const yPx=r.top-gr.top;
      S.sysCfg.desk.appPos = S.sysCfg.desk.appPos || {};
      S.sysCfg.desk.appPos[el.dataset.app] = {x:xPct, y:yPx};save('sysCfg');
      el.style.left=xPct+'%';el.style.top=yPx+'px';
      el._suppressClick=true;setTimeout(()=>{el._suppressClick=false;},350);
    } else if(moved && startEl){
      startEl._suppressClick=true;
      setTimeout(()=>{ if(startEl) startEl._suppressClick=false; },350);
    }
    startEl=null;
  };
  ag.addEventListener('touchend', end);
  ag.addEventListener('touchcancel', end);
}
function enableSortable(container, opts){
  let pressTimer=null, dragEl=null, startX=0, startY=0, lastX=0, lastY=0, moved=false;
  container.addEventListener('touchstart', e=>{
    const item=e.target.closest(opts.itemSelector);
    if(!item || !container.contains(item)) return;
    const t=e.touches[0];
    startX=t.clientX; startY=t.clientY; lastX=startX; lastY=startY; moved=false;
    clearTimeout(pressTimer);
    pressTimer=setTimeout(()=>{if(moved) return;dragEl=item;item.classList.add('dragging');
      if(navigator.vibrate) navigator.vibrate(15);},450);
  },{passive:true});
  container.addEventListener('touchmove', e=>{
    const t=e.touches[0];lastX=t.clientX; lastY=t.clientY;
    if(!dragEl){if(Math.abs(t.clientX-startX)>8||Math.abs(t.clientY-startY)>8){moved=true;clearTimeout(pressTimer);}return;}
    e.preventDefault();
    const dx=t.clientX-startX, dy=t.clientY-startY;
    dragEl.style.transform=`translate(${dx}px,${dy}px) scale(1.08)`;
  },{passive:false});
  const end=()=>{
    clearTimeout(pressTimer);
    if(!dragEl) return;
    const el=dragEl; dragEl=null;
    el.style.pointerEvents='none';
    const target=document.elementFromPoint(lastX,lastY);
    el.style.pointerEvents='';
    el.style.transform='';
    el.classList.remove('dragging');
    const targetItem = target && target.closest ? target.closest(opts.itemSelector) : null;
    if(!targetItem || !container.contains(targetItem) || targetItem===el) return;
    const fromId=opts.getId(el), toId=opts.getId(targetItem);
    if(!fromId||!toId||fromId===toId) return;
    const order=opts.getOrder().slice();
    const from=order.indexOf(fromId), to=order.indexOf(toId);
    if(from<0||to<0) return;
    order.splice(from,1);order.splice(to,0,fromId);opts.setOrder(order);
  };
  container.addEventListener('touchend', end);
  container.addEventListener('touchcancel', end);
}
function setupWidgetDrag(){
  const w=$('#widget');
  if(w._dragBound) return;
  w._dragBound = true;
  let pressTimer=null, dragging=false, startX=0, startY=0, baseX=0, baseY=0;
  const getOffset=()=>S.sysCfg.widget.offset||{x:0,y:0};
  w.addEventListener('touchstart',e=>{
    const t=e.touches[0];startX=t.clientX; startY=t.clientY;
    const off=getOffset();baseX=off.x; baseY=off.y;
    clearTimeout(pressTimer);
    pressTimer=setTimeout(()=>{dragging=true;w.classList.add('dragging');
      if(navigator.vibrate) navigator.vibrate(15);},500);
  },{passive:true});
  w.addEventListener('touchmove',e=>{
    if(!dragging) return;
    e.preventDefault();
    const t=e.touches[0];
    const dx=t.clientX-startX, dy=t.clientY-startY;
    w.style.transform=`translate(${baseX+dx}px,${baseY+dy}px)`;
  },{passive:false});
  const endW=()=>{
    clearTimeout(pressTimer);
    if(!dragging) return;
    dragging=false;w.classList.remove('dragging');
    const m=/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/.exec(w.style.transform||'');

  w.addEventListener('touchend',endW);

}

/* 聊天 */
let pendingQuote = null, multiMode = false, multiSel = new Set();

// 全局变量：记录当前显示多少条消息
let chatRenderLimit = 15;

function renderChat(keepScroll = false){
  const cfg=S.chatCfg.ui;
  $('#chatTaName').textContent = cfg.nameTa||'Ta';
  const list=$('#chatList');
  list.classList.toggle('multi', multiMode);
  const allMsgs=S.chat.msgs;
  
  if(!allMsgs.length){
    list.innerHTML=`<div class="empty">还没有对话，说点什么吧</div>`;
    updateReplyStatus();
    return;
  }
  
  // 只取最后的 chatRenderLimit 条消息
  const startIdx = Math.max(0, allMsgs.length - chatRenderLimit);
  const msgs = allMsgs.slice(startIdx);
  
  let html='';
  // 如果还有更早的消息，在顶部显示一个提示
  if (startIdx > 0) {
    html += `<div style="text-align:center;padding:10px;font-size:11.5px;color:var(--m-text-soft);opacity:0.8;">—— 上滑查看更早的消息 ——</div>`;
  }
  
  for(const m of msgs) html+=msgHTML(m);
  
  // 渲染前记录一下原来的滚动高度和位置
  const prevHeight = list.scrollHeight;
  const prevTop = list.scrollTop;
  
  list.innerHTML=html;
  
  // 如果是触发加载更多（保持位置），就恢复原来的视觉位置；否则滚到底部
  if (keepScroll) {
    list.scrollTop = list.scrollHeight - (prevHeight - prevTop);
  } else {
    list.scrollTop = list.scrollHeight;
  }
  
  updateReplyStatus();
}
function msgHTML(m){
  const cfg=S.chatCfg.ui;
  const av = m.side==='me' ? (cfg.avatarMe||AV_PH) : (cfg.avatarTa||AV_PH);
  if(m.side==='sys'){
    if(m.recalledMsg){
      return `<div class="msg sys"><div class="sys-msg" data-recall="${m.id}" style="cursor:pointer">
        ${esc(m.text)}<em>点击查看</em></div></div>`;
    }
    return `<div class="msg sys"><div class="sys-msg">${esc(m.text)}</div></div>`;
  }
  if(m.side==='ta'&&m.recalled){
    return `<div class="msg sys"><div class="sys-msg" data-recall="${m.id}" style="cursor:pointer">
      ${esc(cfg.nameTa)}撤回了一条消息<em>点击查看</em></div></div>`;
  }
  let inner='';
  if(m.quote) {
  let qHtml = '';
  // 兼容以前没有 src 的纯字符串老数据
  if (typeof m.quote === 'string') {
    qHtml = esc(m.quote);
  } else {
    qHtml = esc(m.quote.text || '');
    if (m.quote.src) {
      // 气泡内显示的缩略图
      qHtml = `<img src="${m.quote.src}" style="height:24px;width:24px;object-fit:contain;vertical-align:middle;margin-right:6px;border-radius:4px;">` + qHtml;
    }
  }
  inner += `<div class="quote" style="display:flex;align-items:center;">${qHtml}</div>`;
}
  if(m.type==='img') inner+=`<img class="msg-img" src="${m.src}">`;
  else if(m.type==='emoji') inner+=`<img class="msg-emoji" src="${m.src}">`;
  else inner+=esc(m.text||'');
  const heart = m.proactive?`<span class="heart">${esc(S.chatCfg.active.mark||'❥')}</span>`:'';
  const ts = S.chatCfg.ts?`<div class="ts">${fmtTime(m.ts)}</div>`:'';
  let bubbleCls = 'bubble';
  if(m.type==='emoji') bubbleCls='bubble" style="background:transparent;box-shadow:none;padding:0';
  else if(m.wooden) bubbleCls='bubble wood';
  const cb = multiMode ? `<input type="checkbox" class="msg-cb" data-cb="${m.id}" ${multiSel.has(m.id)?'checked':''}>` : '';
  return `<div class="msg ${m.side}" data-mid="${m.id}">
    ${cb}
    <img class="av" src="${av}">
    <div class="body">
      <div class="${bubbleCls}">${inner}${heart}</div>
      ${ts}
    </div></div>`;
}
function pushMsg(m){
  m.id=m.id||uid(); m.ts=m.ts||now();
  S.chat.msgs.push(m);save('chat');
  
  // === 优化：只追加新消息，且智能判断滚动位置 ===
  const list = $('#chatList');
  if(!multiMode && list.querySelector('.msg')){
    const empty = list.querySelector('.empty');
    if(empty) empty.remove();

    // 1. 在插入之前，先检查你当前距离底部有多远
    const isNearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 120;

    // 2. 插入新消息
    const temp = document.createElement('div');
    temp.innerHTML = msgHTML(m);
    list.appendChild(temp.firstElementChild);

    // 3. 如果你本来就在底部，或者这条消息是你自己发的，才自动滚到底部
    if(isNearBottom || m.side === 'me'){
      list.scrollTop = list.scrollHeight; 
    }
    // 如果你正在翻看历史记录（不在底部），新消息会静默添加到最下面，你的屏幕不会跳动！
  } else {
    // 否则（比如刚清空聊天、多选模式下），才重新渲染整个列表
    renderChat();
  }
  // =====================================

  if(m.side==='ta'){
    playSound('reply');
    if(!$('#p-chat').classList.contains('active')){
      S.unread = S.unread || {chat:0,letter:0};
      S.unread.chat = (S.unread.chat||0)+1;
      save('unread');
      renderDesktop();
    }
    if(document.hidden){
      const name = S.chatCfg.ui.nameTa || 'Ta';
      const body = m.type==='text' ? m.text : (m.type==='img'?'[图片]':'[表情]');
      notify(name, body);
    }
  }
  updateReplyStatus();
}
function updateReplyStatus(){
  const el=$('#chatStatus');const txt=$('#chatStatusText');

let actionCardEl=null;

function sendText(text){
  if(!text.trim()) return;
  const m=attachQuoteTo({side:'me',type:'text',text:text.trim()});
  pushMsg(m);$('#chatInput').value='';scheduleReply();updateReplyStatus();
}
function scheduleReply(){
  const r=S.chatCfg.reply;
  if(Math.random()*100 < r.readNoReply){
    S.timers.queue.push({t:now()+randInt(1200,3000),kind:'readNoReply'});save('timers');updateReplyStatus();return;
  }
  const n=randInt(r.minCount,r.maxCount);
  let t=now()+randInt(r.minDelay,r.maxDelay)*1000; // 第一条消息的延迟
  for(let i=0;i<n;i++){
    let type='text';
    if(Math.random()*100 < r.emoji){const src=pickEmojiSrc();if(src) type='emoji';}
    const task={t,kind:'reply',payload:{type}};
    if(i===0 && Math.random()*100 < r.quote) task.payload.quote=true;
    S.timers.queue.push(task);
    
    // 优化：如果有多条消息，每条间隔 800~2000 毫秒（0.8秒~2秒），连发更自然
    if (i < n - 1) t += randInt(800, 2000); 
  }
  save('timers');updateReplyStatus();
}
function activeCards(){const active=S.cards.groups.filter(g=>!S.cards.closed.includes(g));return S.cards.list.filter(c=>active.includes(c.g));}
function pickCardText(){
  const pool=activeCards();
  if(!pool.length){return pick(['嗯嗯，我在。','好的呀～','我也是这么想的。','你呢？','抱抱。','今天也要开心哦。']);}
  return pick(pool).t;
}
function pickEmojiSrc(){const e = emojiPick('ta');return e ? e.src : null;}
function doReply(payload){
  if(payload.type==='emoji'){const src=pickEmojiSrc();if(src){pushMsg({side:'ta',type:'emoji',src});return;}}
  const text=pickCardText();const m={side:'ta',type:'text',text};
  if(payload.quote){
  const last=S.chat.msgs.filter(x=>x.side==='me').pop();
  if(last) {
    m.quote = { text: last.type==='text'?last.text:(last.type==='img'?'[图片]':'[表情]') };
    if(last.type === 'img' || last.type === 'emoji') m.quote.src = last.src;
  }
}
  pushMsg(m);
  if(Math.random()*100 < S.chatCfg.reply.recall){
    S.timers.queue.push({t:now()+randInt(2500,6000),kind:'recall',payload:{mid:m.id}});save('timers');
  }
}
function doRecall(mid){
  const m=S.chat.msgs.find(x=>x.id===mid);if(!m) return;
  m.recalled=true;
  m.recalledContent = m.type==='text'?m.text:(m.type==='img'?'[图片]':'[表情]');
  save('chat');
  
  // === 优化：只替换这一条消息的 DOM，不重绘整个聊天列表 ===
  const msgEl = document.querySelector(`[data-mid="${mid}"]`);
  if (msgEl) {
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = msgHTML(m);
    msgEl.parentNode.replaceChild(tempDiv.firstElementChild, msgEl);
  } else {
    renderChat();
  }
  // ========================================================

  if(Math.random()*100 < S.chatCfg.reply.resend){
    S.timers.queue.push({t:now()+randInt(1500,4000),kind:'reply',payload:{type:'text'}});save('timers');
  }
}
function doReadNoReply(){
  const name = S.chatCfg.ui.nameTa || 'Ta';
  pushMsg({side:'sys',type:'sys',text:`${name} 已读了你的消息，但没有回复`});
}
function scheduleProactive(){
  const a=S.chatCfg.active;
  if(!(a.prob>0)){S.timers.nextProactive=0;save('timers');return;}
  const gap=randInt(Math.max(1,a.minGap)*60,Math.max(2,a.maxGap)*60)*1000;
  S.timers.nextProactive=now()+gap;save('timers');
}
function doProactive(){
  const a=S.chatCfg.active;
  if(Math.random()*100 < a.prob){
    const n=randInt(a.minCount,a.maxCount);
    let t=now();
    for(let i=0;i<n;i++){S.timers.queue.push({t,kind:'proactive'});t+=randInt(2000,5000);}
  }
  scheduleProactive();
}

/* =========================================================
   双人签 · 逻辑
   ========================================================= */
function canDrawToday(){
  if(!S.fortune.dailyLimit) return true;
  return S.fortune.lastDrawDate !== getTodayKey();
}
function quickDrawFortune(){
  _fortuneTab='draw';
  _drawStage=0;
  _pendingDraw=null;
  if(!canDrawToday()){
    _fortuneTab='book';
    _bookTab='normal';
    go('fortune');
    setTimeout(()=>toast('今日已抽，明日再来'), 350);
  }else{
    go('fortune');
  }
}
function generateDraw(){
  const normalCnt = S.fortune.drawn.normal.length;
  const specialCnt = S.fortune.drawn.special.length;
  const normalMax = 49, specialMax = 25;
  let group;
  if(normalCnt >= normalMax && specialCnt < specialMax) group = 'special';
  else if(specialCnt >= specialMax && normalCnt < normalMax) group = 'normal';
  else if(normalCnt >= normalMax && specialCnt >= specialMax) group = Math.random()<0.5?'normal':'special';
  else group = Math.random() < 0.6 ? 'normal' : 'special';
  const chars = FORTUNE_DATA[group].chars;
  const user = pick(chars);
  const ta = pick(chars);
  return {type:group, user, ta, isSame:user===ta, drawnAt:now()};
}
function getBookIndex(draw){
  const chars = FORTUNE_DATA[draw.type].chars;
  const row = chars.indexOf(draw.user);
  const col = chars.indexOf(draw.ta);
  return row*chars.length + col + 1;
}
function getBookTotal(draw){return draw.type==='normal'?49:25;}
function getBookName(type){return type==='normal'?'普通阁':'特殊阁';}

function renderFortune(){
  // 如果今天有 currentDraw 且 stage 为 0，说明用户之前已经抽过了（跨会话），恢复
  if(_drawStage === 0 && S.fortune.currentDraw && canDrawToday() === false){
    const cd = S.fortune.currentDraw;
    if(getDayKey(cd.drawnAt) === getTodayKey()){
      _pendingDraw = cd;
      _drawStage = 2;
    }
  }
  // tab 绑定
  $$('#fortuneTabs .tab').forEach(t=>{
    t.classList.toggle('on', t.dataset.ftab === _fortuneTab);
    t.onclick = ()=>{ _fortuneTab = t.dataset.ftab; renderFortune(); };
  });
  const body = $('#fortuneBody');
  if(_fortuneTab === 'draw') renderFortuneDraw(body);
  else renderFortuneBook(body);
}

function renderFortuneDraw(body){
  const canDraw = canDrawToday();
  const todayDone = !canDraw;
  let html = `
  <div class="fortune-toolbar">
    <div class="ft-sw">
      <span>每日只一签</span>
      <div class="switch ${S.fortune.dailyLimit?'on':''}" id="ftDailySw"></div>
    </div>
  </div>`;

  if(todayDone && _drawStage === 0){
    html += `<div class="fortune-banner">今日已抽，明日再来</div>`;
    html += `<div class="fortune-draw-wrap">
      <div class="fortune-tip" style="margin-top:40px;font-size:14px;line-height:2">
        今日一签已落定，<br>去签文阁看看已收录的签吧。
      </div>
      <div class="fortune-actions show" style="margin-top:30px">
        <button class="btn primary" id="ftGoBook">去签文阁</button>
      </div>
    </div>`;
    body.innerHTML = html;
    body.querySelector('#ftDailySw').onclick = ()=>{
      S.fortune.dailyLimit = !S.fortune.dailyLimit;
      save('fortune'); renderFortune();
    };
    body.querySelector('#ftGoBook').onclick = ()=>{ _fortuneTab='book'; _bookTab='normal'; renderFortune(); };
    return;
  }

  const draw = _pendingDraw;
  const stage = _drawStage;

  html += `<div class="fortune-draw-wrap">`;
  if(stage === 0){
    html += `<div class="fortune-tip">点击左侧牌背，翻开今日一签</div>`;
  }else{
    html += `<div class="fortune-tip">${stage===1?'Ta 的牌将在 1 秒后翻开…':'两张签已翻开，点击下方标题查看解析'}</div>`;
  }
  html += `<div class="fortune-cards">`;

  // 用户牌
  const userCls = [
    'fortune-card','user',
    stage >= 1 ? 'flipped' : '',
    (draw && draw.isSame && stage >= 2) ? 'same' : '',
    (draw && draw.isSame && stage >= 2) ? 'same-pulse' : '',
    stage >= 1 ? 'disabled' : ''
  ].filter(Boolean).join(' ');
  html += `<div class="${userCls}" id="fcUser">
    <div class="fc-back left-wood"></div>
    <div class="fc-face">
      <div class="fc-char">${draw?esc(draw.user):'·'}</div>
      <div class="fc-xiang">${draw?esc(FORTUNE_DATA[draw.type].xiang[draw.user]||''):''}</div>
    </div>
  </div>`;

  // Ta 牌
  const taCls = [
    'fortune-card','ta',
    stage >= 2 ? 'flipped' : '',
    (draw && draw.isSame && stage >= 2) ? 'same' : '',
    (draw && draw.isSame && stage >= 2) ? 'same-pulse' : '',
    'disabled'
  ].filter(Boolean).join(' ');
  html += `<div class="${taCls}" id="fcTa">
    <div class="fc-back right-wood"></div>
    <div class="fc-face">
      <div class="fc-char">${draw?esc(draw.ta):'·'}</div>
      <div class="fc-xiang">${draw?esc(FORTUNE_DATA[draw.type].xiang[draw.ta]||''):''}</div>
    </div>
  </div>`;

  html += `</div>`; // fortune-cards

  if(draw && stage >= 2){
    const reading = FORTUNE_DATA[draw.type].readings[draw.user+'•'+draw.ta] || '';
    const sameLabel = draw.isSame ? '同字 · 双签' : `${draw.user}•${draw.ta}`;
    html += `<div class="fortune-title show" id="fortuneTitle">
      <div class="ft-id">${esc(sameLabel)}</div>
      <div class="ft-reading">${esc(reading)}</div>
      <div class="ft-hint">点击查看签文解析</div>
    </div>`;
    html += `<div class="fortune-actions show">
      <button class="btn" id="ftShare">分享到聊天</button>
      <button class="btn primary" id="ftAgain" ${!canDraw?'disabled':''}>${canDraw?'再抽一签':'明日再来'}</button>
      <button class="btn" id="ftGoBook2">去签文阁</button>
    </div>`;
  }

  html += `</div>`; // fortune-draw-wrap
  body.innerHTML = html;

  // 绑定
  body.querySelector('#ftDailySw').onclick = ()=>{
    S.fortune.dailyLimit = !S.fortune.dailyLimit;

  };

  const fcUser = body.querySelector('#fcUser');

  }

  if(btnAgain && canDraw){
    btnAgain.onclick = ()=>{
      _drawStage = 0; _pendingDraw = null;
      renderFortune();
    };
  }
  const btnGoBook2 = body.querySelector('#ftGoBook2');
  if(btnGoBook2) btnGoBook2.onclick = ()=>{ _fortuneTab='book'; _bookTab='normal'; renderFortune(); };
}

function onDrawUserClick(){
  if(!canDrawToday()){toast('今日已抽，明日再来');return;}
  if(_drawStage !== 0) return;
  // 生成抽签
  const draw = generateDraw();
  _pendingDraw = draw;

  // 判定是否已收录
  const group = draw.type;
  const id = draw.user + '•' + draw.ta;
  draw.isNew = !S.fortune.drawn[group].includes(id);

  // 记录 lastDrawDate（每日一签时）
  if(S.fortune.dailyLimit){
    S.fortune.lastDrawDate = getTodayKey();
  }
  // 点亮
  if(draw.isNew){
    S.fortune.drawn[group].push(id);
  }
  // 存 currentDraw
  S.fortune.currentDraw = {
    type: draw.type, user: draw.user, ta: draw.ta,
    isSame: draw.isSame, isNew: draw.isNew, drawnAt: draw.drawnAt
  };
  save('fortune');

  // 翻开用户牌
  const fcUser = $('#fcUser');
  if(fcUser) fcUser.classList.add('flipped');
  _drawStage = 1;

  // 1 秒后翻开 Ta 牌
  setTimeout(()=>{
    const fcTa = $('#fcTa');
    if(fcTa){
      fcTa.classList.add('flipped');
      if(draw.isSame){ fcTa.classList.add('same','same-pulse'); fcUser.classList.add('same','same-pulse'); }
    }
    _drawStage = 2;
    // 重新渲染以显示标题和按钮
    setTimeout(()=>renderFortune(), 100);
  }, 1000);
}

function showFortuneReading(draw, fromBook){
  if(!draw) return;
  const data = FORTUNE_DATA[draw.type];
  const reading = data.readings[draw.user+'•'+draw.ta] || '';
  const xiangUser = data.xiang[draw.user] || '';
  const xiangTa = data.xiang[draw.ta] || '';
  const isSame = draw.isSame;
  const groupName = getBookName(draw.type);
  const id = draw.user + '•' + draw.ta;
  const isDrawnNow = S.fortune.drawn[draw.type].includes(id);
  const idx = getBookIndex(draw);
  const total = getBookTotal(draw);

  let badgeHtml = '';
  if(isSame){
    badgeHtml = `<div class="reading-badge fresh">同字 · 双签 · ${groupName}第 ${idx} 格</div>`;

function renderFortuneBook(body){
  const dailyBanner = canDrawToday() ? '' : `<div class="fortune-banner">今日已抽，明日再来</div>`;

  let html = dailyBanner;
  html += `<div class="fortune-book-wrap">
    <div class="book-tabs">
      <div class="tab ${_bookTab==='normal'?'on':''}" data-btab="normal">普通阁</div>
      <div class="tab ${_bookTab==='special'?'on':''}" data-btab="special">特殊阁</div>
    </div>`;

  const group = _bookTab;
  const data = FORTUNE_DATA[group];
  const chars = data.chars;
  const drawnList = S.fortune.drawn[group] || [];
  const total = group==='normal'?49:25;
  const drawnCnt = drawnList.length;

  html += `<div class="book-progress">已收录 ${drawnCnt} / ${total}</div>`;

  // 网格
  html += `<div class="book-grid" style="grid-template-columns:repeat(${chars.length},1fr)">`;
  for(let r = 0; r < chars.length; r++){
    for(let c = 0; c < chars.length; c++){
      const userChar = chars[r];
      const taChar = chars[c];
      const id = userChar + '•' + taChar;
      const isSame = r === c;
      const isDrawn = drawnList.includes(id);
      const cls = [
        'book-cell',
        isDrawn ? 'drawn' : 'undrawn',
        (isDrawn && isSame) ? 'same' : ''
      ].filter(Boolean).join(' ');
      html += `<div class="${cls}" data-bid="${esc(id)}" data-bgroup="${group}" data-br="${r}" data-bc="${c}">`;
      if(isDrawn){
        html += `<span class="cell-char">${esc(userChar)}</span><span class="cell-char">${esc(taChar)}</span>`;
      }
      html += `</div>`;
    }
  }
  html += `</div>`;

  html += `<div class="book-legend">
    <div class="lg"><span class="lg-sq u"></span>未点亮</div>
    <div class="lg"><span class="lg-sq d"></span>已点亮</div>
    <div class="lg"><span class="lg-sq s"></span>同字签</div>
  </div>`;

  html += `<div class="fortune-actions show" style="margin-top:20px">
    <button class="btn danger" id="ftClear">清空签文阁</button>
  </div>`;

  html += `</div>`;

  body.innerHTML = html;

  // tab 绑定
  body.querySelectorAll('[data-btab]').forEach(t=>{
    t.onclick = ()=>{ _bookTab = t.dataset.btab; renderFortune(); };
  });

  // 已点亮格子点击
  body.querySelectorAll('.book-cell.drawn').forEach(cell=>{
    cell.onclick = ()=>{
      const id = cell.dataset.bid;
      const grp = cell.dataset.bgroup;
      const parts = id.split('•');
      const draw = {
        type: grp, user: parts[0], ta: parts[1],
        isSame: parts[0]===parts[1], isNew: false,
        drawnAt: now()
      };
      showFortuneReading(draw, true);
    };
  });

  // 清空
  body.querySelector('#ftClear').onclick = ()=>{
    const nCnt = (S.fortune.drawn.normal||[]).length;
    const sCnt = (S.fortune.drawn.special||[]).length;
    if(nCnt === 0 && sCnt === 0){ toast('签文阁已经是空的'); return; }
    confirmBox(
      `将清空普通阁 ${nCnt} 格、特殊阁 ${sCnt} 格，抽签进度归零。此操作不可恢复。`,
      ()=>{
        S.fortune.drawn = {normal:[],special:[]};
        S.fortune.lastDrawDate = '';
        S.fortune.currentDraw = null;
        _drawStage = 0; _pendingDraw = null;
        save('fortune');
        renderFortune();
        toast('签文阁已清空');
      },
      '清空'
    );
  };
}

function getPath(p){const parts=p.split('.');let o=S;for(const k of parts){if(o==null)return undefined;o=o[k];}return o;}
function setPath(p,v){
  const parts=p.split('.');let o=S;
  for(let i=0;i<parts.length-1;i++){if(!o[parts[i]])o[parts[i]]={};o=o[parts[i]];}

}

function bindAll(root){
  root.querySelectorAll('[data-sound]').forEach(b=>{
    b.onclick=()=>{
      const [kind,id]=b.dataset.sound.split(':');
      playPreset(id);
      if(kind==='reply') S.chatCfg.ui.soundReply=id;else S.chatCfg.ui.soundCall=id;
      save('chatCfg');
      root.querySelectorAll(`[data-sound^="${kind}:"]`).forEach(x=>{x.classList.toggle('primary',x===b);});
      toast('已选择并试听');
    };
  });
  root.querySelectorAll('[data-switch]').forEach(sw=>{
    sw.onclick=()=>{const p=sw.dataset.switch;const v=!getPath(p);setPath(p,v);sw.classList.toggle('on',v);};
  });
  root.querySelectorAll('[data-filebtn]').forEach(b=>{
    b.onclick=()=>{const p=b.dataset.filebtn;const inp=root.querySelector(`[data-file="${p}"]`);if(inp) inp.click();};
  });
  root.querySelectorAll('[data-file]').forEach(inp=>{
    inp.onchange=async()=>{
      const f=inp.files[0];if(!f)return;
      const p=inp.dataset.file;
      const isText=/json|txt/i.test(f.type)||/\.(json|txt)$/i.test(f.name);
      const v=await readFile(f,isText?'text':'dataURL');
      if(p==='sysCfg.fontData'){S.sysCfg.fontData=v;S.sysCfg.fontName=f.name;save('sysCfg');applyFont();toast('字体已应用');}
      else{setPath(p,v);toast('已更新');
        if(p==='chatCfg.ui.soundReply'||p==='chatCfg.ui.soundCall'){playSound(p==='chatCfg.ui.soundCall'?'call':'reply');}}
    };
  });
  root.querySelectorAll('[data-bind]').forEach(inp=>{
    const handler=()=>{
      let v=(inp.type==='range'||inp.type==='number')?Number(inp.value):inp.value;
      setPath(inp.dataset.bind,v);
      if(inp.type==='range'){
        const r=inp.parentElement.querySelector('.rv');
        if(r){const unit=/radius|size|height|width/i.test(inp.dataset.bind)?'px':(/alpha/i.test(inp.dataset.bind)?'':'px');r.textContent=v+unit;}
      }
    };
    inp.addEventListener('input',handler);inp.addEventListener('change',handler);
  });
}
function pickImg(cb){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;cb(await readFile(f));};
  inp.click();
}

function renderSeek(){
  const s=S.seek;
  
  // 如果没有当前状态，先生成一次并保存
  if(!s.current){
    s.current = {
      loc: s.loc.length ? pick(s.loc) : ' ',
      act: s.act.length ? pick(s.act) : ' ',
      lnk: s.link.length ? pick(s.link) : ' '
    };
    save('seek');
  }
  
  // 读取当前状态
  const { loc, act, lnk } = s.current;

  $('#seekBody').innerHTML=`
    <div class="card"><h3>此刻的Ta</h3>
      <div class="row"><span>位置</span><b>${esc(loc)}</b></div>
      <div class="row"><span>正在做什么</span><b>${esc(act)}</b></div>
      <div class="row"><span>与你的链接</span><b>${esc(lnk)}</b></div>
    </div>
    <button class="btn primary block" id="seekRefresh">刷新</button>
    <div class="card" style="margin-top:14px">
      <h3>寻踪记录
        <button class="btn sm danger" id="seekClear">清空</button></h3>
      <div id="seekLogs">${s.logs.length?s.logs.slice().reverse().map(l=>
        `<div class="list-item"><div class="li-main">${esc(l.text)}
          <div class="li-sub">${fmtDate(l.ts)}</div></div></div>`).join(''):
        '<div class="empty">暂无记录</div>'}</div>
    </div>`;
    
  $('#seekRefresh').onclick=()=>{
    // 点击刷新时，生成新的内容
    const newLoc = s.loc.length ? pick(s.loc) : ' ';
    const newAct = s.act.length ? pick(s.act) : ' ';
    const newLnk = s.link.length ? pick(s.link) : ' ';
    
    s.current = { loc: newLoc, act: newAct, lnk: newLnk };
    
    // 存入日志
    const t=`${newLoc} · ${newAct} · ${newLnk}`;
    S.seek.logs.push({ts:now(),text:t});
    if(S.seek.logs.length>200) S.seek.logs=S.seek.logs.slice(-200);
    
    save('seek');
    renderSeek();
    toast('已刷新');
  };
  
  $('#seekClear').onclick=()=>confirmBox('清空全部寻踪记录？',()=>{S.seek.logs=[];save('seek');renderSeek();},'清空');
}

    inp.click();

  function renderImgs(){ov.querySelector('#ltImgs').innerHTML=imgs.map(i=>`<img src="${i}" style="max-width:70px;border-radius:8px">`).join('');}
  ov.querySelector('#ltSend').onclick=()=>{

    const lc=S.chatCfg.letter;
    if(Math.random()*100 < lc.replyProb){

}
function taLetterContent(){
  const lc=S.chatCfg.letter;
  const n=randInt(Math.max(1,lc.minCards),Math.max(1,lc.maxCards));
  const pool=activeCards();
  let parts=[];
  
  for(let i=0;i<n;i++){
    if(pool.length) {
      // 去掉字卡末尾自带的一些标点，防止出现“。，”这种连续标点
      let text = pick(pool).t.replace(/[，。！？；、…~～\s]+$/, '');
      parts.push(text);
    } else {
      // 兜底默认句子
      parts.push(pick(['今天想到你了', '你在做什么呢', '要好好的', '我一直都在']));
    }
  }

  // 预设中间使用的随机标点符号
  const midPuncts = ['，', '。', '！', '？', '；', '…', '～', '，', '。', ''];
  // 预设结尾使用的标点符号
  const endPuncts = ['。', '！', '～', '…'];

  let result = '';
  for(let i = 0; i < parts.length; i++){
    result += parts[i];
    if(i < parts.length - 1){
      // 如果不是最后一句，随机加一个中间标点
      result += pick(midPuncts);
    } else {
      // 如果是最后一句，加一个结尾标点
      result += pick(endPuncts);
    }
  }
  
  return result;
}
